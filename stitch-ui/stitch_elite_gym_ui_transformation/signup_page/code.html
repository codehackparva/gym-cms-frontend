<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent z-10"></div>
<div class="w-full h-full bg-cover bg-center grayscale contrast-125 opacity-40 scale-105" data-alt="A moody, high-contrast photograph of a professional athlete training in a dark, industrial gym. The scene features deep obsidian shadows and sharp rim lighting that highlights muscle definition and metallic gym equipment. The color palette is strictly dark grays and blacks with a focused, disciplined atmosphere, reflecting the elite IRON PULSE performance branding." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBrDSXWpMd1hPvUIrxSI2Bm9VsJjbV8350suBnssUGCOV8yb5wenFBSp2zbFLFgM-c36TFsaKXYI3aKpcGUqLp6jZaSieRaZiiNL4OcQBGknLRLjDYN12MglSaovBTv9LZWCg6u4OFC8KHl2eVJFz3iXLkrzJGGEXZigdL9UYv723PWVYkDtcKBwevfQ4Aq8Kjr-z3MSh0HEFjHB8rsGp9YKN_YprA3OFQEy614Y3M9x0DEEU7ypq7_8GFZ6PQ8SIE4AWPVa0837Zs3')">

<!-- Registration Container -->
<main class="relative z-20 w-full max-w-[520px]">
<!-- Brand Header -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter leading-none mb-2">IRON PULSE</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.3em]">Elite Performance CMS</p>
</div>
<!-- Registration Card -->
<div class="glass-card rounded-2xl p-8 md:p-10 glow-accent">
<div class="mb-8">
<h2 class="font-heading-2 text-heading-2 text-on-surface mb-2">CREATE YOUR ACCOUNT</h2>
<p class="text-on-surface-variant text-sm">Join the network of elite performance managers and athletes.</p>
</div>
<!-- OAuth Option -->
<button class="w-full flex items-center justify-center gap-3 bg-white text-on-background py-3.5 px-4 rounded-xl font-bold transition-transform active:scale-95 hover:bg-zinc-100 mb-8">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-zinc-900">CONTINUE WITH GOOGLE</span>
</button>
<!-- Separator -->
<div class="relative flex items-center gap-4 mb-8">
<div class="h-[1px] flex-1 bg-surface-border"></div>
<span class="text-label-caps text-on-surface-variant text-[10px] uppercase tracking-widest">OR REGISTER WITH EMAIL</span>
<div class="h-[1px] flex-1 bg-surface-border"></div>
</div>
<!-- Signup Form -->
<form class="space-y-5">
<div class="grid grid-cols-1 gap-5">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="text-label-caps text-xs text-on-surface-variant font-semibold uppercase tracking-wider ml-1">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-low border border-surface-border rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-surface-variant focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="text-label-caps text-xs text-on-surface-variant font-semibold uppercase tracking-wider ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-low border border-surface-border rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-surface-variant focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="manager@ironpulse.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- Password -->
<div class="space-y-1.5">
<label class="text-label-caps text-xs text-on-surface-variant font-semibold uppercase tracking-wider ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-low border border-surface-border rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-surface-variant focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1.5">
<label class="text-label-caps text-xs text-on-surface-variant font-semibold uppercase tracking-wider ml-1">Confirm</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">shield</span>
<input class="w-full bg-surface-container-low border border-surface-border rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-surface-variant focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 mt-4">

<label class="text-xs text-on-surface-variant leading-relaxed" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a> regarding my athlete performance data.
                    </label>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary-container text-white py-4 px-6 rounded-xl font-action-text text-action-text tracking-widest shadow-lg shadow-primary-container/20 hover:shadow-primary-container/40 transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2 group" type="submit">
                    INITIALIZE PROFILE

</button>
</form>
<!-- Footer Links -->
<div class="mt-10 pt-6 border-t border-surface-border text-center">
<p class="text-on-surface-variant text-sm">
                    ALREADY REGISTERED? 
                    <a class="text-primary font-bold hover:text-primary/80 transition-colors ml-1 uppercase tracking-tight" href="#">Access Control (Login)</a>
</p>
</div>
</div>
<!-- Security Footer -->
<div class="mt-8 flex items-center justify-center gap-8 opacity-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">encrypted</span>
<span class="text-[10px] font-label-caps tracking-widest uppercase">SSL SECURED</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="text-[10px] font-label-caps tracking-widest uppercase">GDPR COMPLIANT</span>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        // Subtle floating effect for the main container
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('main');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Add visual feedback on input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.previousElementSibling;
                if (icon && icon.classList.contains('material-symbols-outlined')) {
                    icon.style.fontVariationSettings = "'FILL' 1";
                }
            });
            input.addEventListener('blur', () => {
                const icon = input.previousElementSibling;
                if (icon && icon.classList.contains('material-symbols-outlined')) {
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });
        });
    </script>
